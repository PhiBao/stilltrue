<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="arch-title arch-desc" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">
  <title id="arch-title">StillTrue check architecture</title>
  <desc id="arch-desc">An answer is segmented deterministically, volatile claims are searched on the live web through Tavily, evidence is bundled, and a Bifrost-routed model adjudicates each claim before only changed sentences are repaired.</desc>

  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#423d35"/>
    </marker>
    <marker id="arch-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6049"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f4efe4"/>

  <text x="48" y="58" fill="#171512" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="400" letter-spacing="-0.8">One check, end to end.</text>
  <text x="48" y="86" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.04em">DETERMINISTIC SEGMENTATION · LIVE EVIDENCE · ONE ADJUDICATION CALL</text>

  <!-- connectors drawn first -->
  <line x1="180" y1="248" x2="220" y2="248" stroke="#423d35" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <line x1="384" y1="248" x2="424" y2="248" stroke="#423d35" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <line x1="588" y1="248" x2="628" y2="248" stroke="#423d35" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <line x1="792" y1="248" x2="832" y2="248" stroke="#423d35" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <line x1="996" y1="248" x2="1036" y2="248" stroke="#423d35" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

  <!-- live web up to tavily -->
  <line x1="510" y1="436" x2="510" y2="304" stroke="#2c6049" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arch-arrow-link)"/>
  <rect x="516" y="356" width="58" height="14" fill="#f4efe4"/>
  <text x="520" y="366" fill="#2c6049" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.08em">QUERY</text>

  <!-- adjudicate down to model route -->
  <line x1="918" y1="296" x2="918" y2="432" stroke="#2c6049" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arch-arrow-link)"/>
  <rect x="924" y="356" width="92" height="14" fill="#f4efe4"/>
  <text x="928" y="366" fill="#2c6049" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.08em">MODEL CALL</text>

  <!-- answer -->
  <rect x="48" y="200" width="132" height="96" rx="6" fill="#f4efe4" stroke="#171512" stroke-width="1.2"/>
  <text x="64" y="232" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">INPUT</text>
  <text x="64" y="256" fill="#171512" font-size="17" font-weight="600" letter-spacing="-0.2">Answer</text>
  <text x="64" y="275" fill="#7b7263" font-size="10.5">pasted or generated</text>

  <!-- segment -->
  <rect x="228" y="200" width="156" height="96" rx="6" fill="#ece5d6" stroke="#171512" stroke-width="1.2"/>
  <text x="244" y="232" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">01 · RUST</text>
  <text x="244" y="256" fill="#171512" font-size="17" font-weight="600" letter-spacing="-0.2">Segment</text>
  <text x="244" y="275" fill="#7b7263" font-size="10.5">exact sentence offsets</text>

  <!-- tavily -->
  <rect x="432" y="200" width="156" height="96" rx="6" fill="#ece5d6" stroke="#171512" stroke-width="1.2"/>
  <text x="448" y="232" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">02 · TAVILY</text>
  <text x="448" y="256" fill="#171512" font-size="17" font-weight="600" letter-spacing="-0.2">Verify</text>
  <text x="448" y="275" fill="#7b7263" font-size="10.5">volatile claims only</text>

  <!-- evidence -->
  <rect x="636" y="200" width="156" height="96" rx="6" fill="#ece5d6" stroke="#171512" stroke-width="1.2"/>
  <text x="652" y="232" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">03 · BUNDLE</text>
  <text x="652" y="256" fill="#171512" font-size="17" font-weight="600" letter-spacing="-0.2">Evidence</text>
  <text x="652" y="275" fill="#7b7263" font-size="10.5">quoted, dated, cited</text>

  <!-- adjudicate focal -->
  <rect x="840" y="200" width="156" height="96" rx="6" fill="#171512" stroke="#171512" stroke-width="1.2"/>
  <text x="856" y="232" fill="#b93b1c" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">04 · BIFROST</text>
  <text x="856" y="256" fill="#f4efe4" font-size="17" font-weight="600" letter-spacing="-0.2">Adjudicate</text>
  <text x="856" y="275" fill="#d3c9b6" font-size="10.5">cite, change, or abstain</text>

  <!-- repair -->
  <rect x="1044" y="200" width="132" height="96" rx="6" fill="#f4efe4" stroke="#171512" stroke-width="1.2"/>
  <text x="1060" y="232" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">05 · RUST</text>
  <text x="1060" y="256" fill="#171512" font-size="17" font-weight="600" letter-spacing="-0.2">Repair</text>
  <text x="1060" y="275" fill="#7b7263" font-size="10.5">changed claims only</text>

  <!-- live web -->
  <rect x="432" y="436" width="156" height="88" rx="6" fill="#f4efe4" stroke="#7b7263" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="448" y="466" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">EXTERNAL</text>
  <text x="448" y="490" fill="#171512" font-size="16" font-weight="600" letter-spacing="-0.2">Live web</text>
  <text x="448" y="508" fill="#7b7263" font-size="10.5">current, linkable sources</text>

  <!-- model route -->
  <rect x="840" y="436" width="156" height="88" rx="6" fill="#f4efe4" stroke="#7b7263" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="856" y="466" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8.5" letter-spacing="0.1em">EXTERNAL · GOVERNED</text>
  <text x="856" y="490" fill="#171512" font-size="16" font-weight="600" letter-spacing="-0.2">Model route</text>
  <text x="856" y="508" fill="#7b7263" font-size="10.5">primary + fallback</text>

  <!-- flow labels -->
  <rect x="382" y="226" width="44" height="13" fill="#f4efe4"/>
  <text x="404" y="236" text-anchor="middle" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8" letter-spacing="0.08em">CLAIMS</text>
  <rect x="588" y="226" width="42" height="13" fill="#f4efe4"/>
  <text x="609" y="236" text-anchor="middle" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8" letter-spacing="0.08em">SOURCES</text>
  <rect x="792" y="226" width="42" height="13" fill="#f4efe4"/>
  <text x="813" y="236" text-anchor="middle" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8" letter-spacing="0.08em">BUNDLE</text>
  <rect x="996" y="226" width="42" height="13" fill="#f4efe4"/>
  <text x="1017" y="236" text-anchor="middle" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="8" letter-spacing="0.08em">VERDICTS</text>

  <!-- legend -->
  <line x1="48" y1="596" x2="1152" y2="596" stroke="#d3c9b6" stroke-width="1"/>
  <rect x="48" y="616" width="10" height="10" fill="#ece5d6" stroke="#171512" stroke-width="1"/>
  <text x="66" y="625" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.06em">PROCESS</text>
  <rect x="150" y="616" width="10" height="10" fill="#f4efe4" stroke="#7b7263" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="168" y="625" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.06em">EXTERNAL</text>
  <rect x="256" y="616" width="10" height="10" fill="#171512" stroke="#171512" stroke-width="1"/>
  <text x="274" y="625" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.06em">FOCAL DECISION</text>
  <text x="1152" y="625" text-anchor="end" fill="#7b7263" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.06em">STILLTRUE · GLOBAL AI HACKATHON 2026</text>
</svg>
