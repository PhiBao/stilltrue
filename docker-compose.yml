name: stilltrue

services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: stilltrue-bifrost
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./infra/bifrost:/app/data
    networks:
      - stilltrue

  stilltrue-ollama:
    image: ollama/ollama:latest
    container_name: stilltrue-ollama
    restart: unless-stopped
    profiles:
      - local-fallback
    volumes:
      - ollama:/root/.ollama
    networks:
      - stilltrue

  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    container_name: stilltrue-api
    restart: unless-stopped
    environment:
      PORT: 8788
      DATABASE_URL: sqlite:///app/data/stilltrue.db?mode=rwc
      BIFROST_URL: http://stilltrue-bifrost:8080
      BIFROST_VK: sk-bf-stilltrue-dev
      BIFROST_MODEL: pollinations/openai-fast
      BIFROST_FALLBACK: ollama-local/qwen2.5:3b-instruct
      BIFROST_DRILL_MODEL: outage-lab/chat
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      MAX_CLAIMS: 6
      TAVILY_MAX_RESULTS: 4
      EXTRACTION_MODE: heuristic
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
    ports:
      - "8788:8788"
    volumes:
      - api-data:/app/data
    depends_on:
      - bifrost
    networks:
      - stilltrue

  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://stilltrue-api:8788
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8788}
    container_name: stilltrue-web
    restart: unless-stopped
    environment:
      API_ORIGIN: http://stilltrue-api:8788
    ports:
      - "3100:3000"
    depends_on:
      - api
    networks:
      - stilltrue

networks:
  stilltrue:
    name: stilltrue

volumes:
  api-data:
  ollama:
