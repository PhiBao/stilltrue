name: stilltrue

services:
  bifrost:
    image: maximhq/bifrost@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
    container_name: stilltrue-bifrost
    restart: unless-stopped
    environment:
      TOKENFACTORY_API_KEY: ${TOKENFACTORY_API_KEY}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/bifrost:/app/data
    networks:
      - stilltrue

  drill:
    build:
      context: ./infra/drill-server
    container_name: stilltrue-drill
    restart: unless-stopped
    networks:
      - stilltrue

  stilltrue-ollama:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: stilltrue-ollama
    restart: unless-stopped
    profiles:
      - local-fallback
    volumes:
      - ollama:/root/.ollama
    networks:
      - stilltrue

  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    container_name: stilltrue-api
    restart: unless-stopped
    environment:
      PORT: 8788
      DATABASE_URL: sqlite:///app/data/stilltrue.db?mode=rwc
      BIFROST_URL: http://stilltrue-bifrost:8080
      BIFROST_VK: sk-bf-stilltrue-dev
      BIFROST_MODEL: tokenfactory/Qwen/Qwen3-30B-A3B-Instruct-2507
      BIFROST_FALLBACK: pollinations/openai-fast
      BIFROST_DRILL_MODEL: outage-lab/chat
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      MAX_CLAIMS: 6
      TAVILY_MAX_RESULTS: 4
      EXTRACTION_MODE: hybrid
      RATE_LIMIT_PER_HOUR: 200
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
    ports:
      - "8788:8788"
    volumes:
      - api-data:/app/data
    depends_on:
      - bifrost
      - drill
    networks:
      - stilltrue

  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://stilltrue-api:8788
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8788}
    container_name: stilltrue-web
    restart: unless-stopped
    environment:
      API_ORIGIN: http://stilltrue-api:8788
    ports:
      - "3100:3000"
    depends_on:
      - api
    networks:
      - stilltrue

networks:
  stilltrue:
    name: stilltrue

volumes:
  api-data:
  ollama:
